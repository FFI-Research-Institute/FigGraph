<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" width="1120" height="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1118" height="238" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- 1. figure folder (stack of thumbnails) -->
  <g>
    <rect x="74" y="92" width="88" height="58" rx="6" fill="#eaecef" stroke="#afb8c1"/>
    <rect x="86" y="80" width="88" height="58" rx="6" fill="#eef1f4" stroke="#afb8c1"/>
    <rect x="98" y="68" width="88" height="58" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <polyline points="110,112 124,96 138,104 152,84" fill="none" stroke="#8b949e" stroke-width="2"/>
    <text x="130" y="206" font-size="18" fill="#57606a" text-anchor="middle">figure folder</text>
  </g>
  <line x1="200" y1="100" x2="338" y2="100" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 2. FTS5 index (db cylinder) -->
  <g>
    <path d="M362,76 a52,14 0 0 1 104,0 l0,52 a52,14 0 0 1 -104,0 z" fill="#f0ebff" stroke="#8b5cf6"/>
    <ellipse cx="414" cy="76" rx="52" ry="14" fill="#f0ebff" stroke="#8b5cf6"/>
    <text x="414" y="118" font-size="15" fill="#6e3fd1" text-anchor="middle" font-weight="600">FTS5</text>
    <text x="414" y="206" font-size="18" fill="#57606a" text-anchor="middle">caption index</text>
  </g>
  <line x1="480" y1="100" x2="612" y2="100" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 3. search -->
  <g>
    <rect x="620" y="74" width="160" height="56" rx="28" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="652" cy="102" r="13" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <line x1="662" y1="112" x2="674" y2="124" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round"/>
    <text x="700" y="108" font-size="17" fill="#57606a">query</text>
    <text x="700" y="206" font-size="18" fill="#57606a" text-anchor="middle">figraph search</text>
  </g>
  <line x1="792" y1="100" x2="856" y2="100" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 4. ranked exemplars -->
  <g>
    <rect x="876" y="66" width="208" height="30" rx="6" fill="#f0ebff" stroke="#8b5cf6" stroke-width="1.6"/>
    <rect x="884" y="72" width="18" height="18" rx="3" fill="#ffffff" stroke="#8b5cf6"/>
    <line x1="912" y1="81" x2="1066" y2="81" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
    <rect x="876" y="100" width="208" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="884" y="106" width="18" height="18" rx="3" fill="#eef1f4" stroke="#afb8c1"/>
    <line x1="912" y1="115" x2="1050" y2="115" stroke="#afb8c1" stroke-width="3" stroke-linecap="round"/>
    <rect x="876" y="134" width="208" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="884" y="140" width="18" height="18" rx="3" fill="#eef1f4" stroke="#afb8c1"/>
    <line x1="912" y1="149" x2="1058" y2="149" stroke="#afb8c1" stroke-width="3" stroke-linecap="round"/>
    <text x="980" y="206" font-size="18" fill="#57606a" text-anchor="middle">ranked exemplars</text>
  </g>
</svg>
