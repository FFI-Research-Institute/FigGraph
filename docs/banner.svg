<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
  <rect x="1" y="1" width="1278" height="338" rx="18" fill="#0d1117" stroke="#21262d" stroke-width="2"/>

  <!-- wordmark -->
  <text x="80" y="158" font-size="92" font-weight="700">
    <tspan fill="#8b5cf6">Fig</tspan><tspan fill="#e6edf3">Graph</tspan>
  </text>
  <text x="84" y="206" font-size="30" fill="#8b949e" font-weight="500">codegraph, but for your figures</text>
  <text x="84" y="252" font-size="20" fill="#6e7681">
    <tspan fill="#3fb950">$</tspan> figraph search <tspan fill="#a5d6ff">"umap single-cell"</tspan>
  </text>

  <!-- figure-grid motif: thumbnails, one matched + magnifier -->
  <g>
    <rect x="900"  y="70"  width="86" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="1004" y="70"  width="86" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="1108" y="70"  width="86" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="900"  y="146" width="86" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <!-- matched figure -->
    <rect x="1004" y="146" width="86" height="58" rx="8" fill="#1d2535" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="1108" y="146" width="86" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="900"  y="222" width="86" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="1004" y="222" width="86" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="1108" y="222" width="86" height="58" rx="8" fill="#161b22" stroke="#30363d"/>

    <!-- tiny chart glyphs inside a few thumbnails -->
    <polyline points="912,118 928,100 944,110 960,86" fill="none" stroke="#6e7681" stroke-width="2"/>
    <g fill="#6e7681"><rect x="1016" y="248" width="9" height="22"/><rect x="1030" y="240" width="9" height="30"/><rect x="1044" y="232" width="9" height="38"/><rect x="1058" y="244" width="9" height="26"/></g>
    <g fill="#8b5cf6"><circle cx="1022" cy="186" r="3"/><circle cx="1036" cy="176" r="3"/><circle cx="1050" cy="182" r="3"/><circle cx="1064" cy="170" r="3"/><circle cx="1042" cy="190" r="3"/></g>

    <!-- magnifier over the match -->
    <circle cx="1086" cy="190" r="22" fill="none" stroke="#8b5cf6" stroke-width="4"/>
    <line x1="1102" y1="206" x2="1120" y2="224" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
